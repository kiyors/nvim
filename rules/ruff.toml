line-length    = 120
target-version = "py311"

[lint]
# E,F = pycodestyle errors + pyflakes (default); add a few useful sets
ignore = [
  "E501", # line too long (formatter handles wrapping)
]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]

[lint.per-file-ignores]
"__init__.py"   = [ "F401" ] # re-exports
"tests/**/*.py" = [ "B011" ]

[format]
indent-style = "space"
quote-style  = "double"
